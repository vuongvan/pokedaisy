name: Build patched APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Apply every patch in patches/
        run: |
          shopt -s nullglob
          for p in patches/*.patch; do
            echo "applying $p"
            git apply --check "$p"
            git apply "$p"
          done

      # Only the sources the Android build compiles: mGBA, rcheevos, melonDS, DSperate (not Azahar, BananaDS, gpSP...), shallow.
      - name: Native dependencies
        run: git submodule update --init --depth 1 --recursive third_party/mgba third_party/rcheevos third_party/melonds third_party/dsperate

      - name: ccache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1500M" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: NDK + CMake
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" "platforms;android-34"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          validate-wrappers: false

      - name: Check generated game data
        run: python3 scripts/gen_gamedata.py --check

      - name: Debug APK
        run: ./gradlew :app:assembleRelease -Ppokedaisy.ccache=true --stacktrace

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pokedaisy-epsilon-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
