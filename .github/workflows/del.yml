name: Cleanup Workflow Runs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete All Workflow Runs
    runs-on: ubuntu-latest

    steps:
      - name: Delete All Workflow Runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let deleted = 0;
            let skipped = 0;
            let failed = 0;

            // Lấy toàn bộ runs của repository
            const allRuns = [];
            let page = 1;

            console.log('Fetching workflow runs...');

            while (true) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
                page
              });

              const runs = response.data.workflow_runs || [];

              if (runs.length === 0) break;

              allRuns.push(...runs);

              if (runs.length < 100) break;

              page++;
            }

            console.log(`Found ${allRuns.length} workflow runs`);

            // Xóa tất cả runs
            for (const run of allRuns) {

              // Bỏ qua workflow đang thực hiện
              if (String(run.id) === String(context.runId)) {
                skipped++;
                continue;
              }

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });

                deleted++;

                console.log(
                  `Deleted: ${run.name} | ${run.event} | ${run.id}`
                );

              } catch (error) {
                failed++;

                console.log(
                  `Failed: ${run.id} | ${error.message}`
                );
              }
            }

            console.log('');
            console.log('========== CLEANUP SUMMARY ==========');
            console.log(`Total found: ${allRuns.length}`);
            console.log(`Deleted: ${deleted}`);
            console.log(`Skipped: ${skipped}`);
            console.log(`Failed: ${failed}`);
            console.log('=====================================');
