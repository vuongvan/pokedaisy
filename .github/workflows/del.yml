name: Cleanup Workflow Runs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete All Workflow Runs
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            let deleted = 0;
            let skipped = 0;

            for (const workflow of workflows) {
              console.log(`Processing: ${workflow.name}`);

              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.id,
                  per_page: 100
                },
                response => response.data.workflow_runs
              );

              for (const run of runs) {
                // Không xóa workflow đang thực thi
                if (run.id === context.runId) {
                  skipped++;
                  continue;
                }

                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });

                  deleted++;
                  console.log(`Deleted run: ${run.id}`);
                } catch (error) {
                  console.log(`Failed to delete ${run.id}: ${error.message}`);
                }
              }
            }

            console.log('-------------------------');
            console.log(`Total deleted: ${deleted}`);
            console.log(`Total skipped: ${skipped}`);
