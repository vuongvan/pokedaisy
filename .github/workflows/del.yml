
name: Cleanup Workflow Runs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Delete All Workflow Runs
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let deleted = 0;
            let skipped = 0;
            let failed = 0;

            // Lấy toàn bộ workflows
            const workflows = [];
            let page = 1;

            while (true) {
              const response = await github.rest.actions.listRepoWorkflows({
                owner,
                repo,
                per_page: 100,
                page
              });

              const items = response.data.workflows || [];
              if (items.length === 0) break;

              workflows.push(...items);
              page++;
            }

            console.log(`Found ${workflows.length} workflows`);

            // Xử lý từng workflow
            for (const workflow of workflows) {
              console.log(`Processing: ${workflow.name}`);

              let runPage = 1;

              while (true) {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflow.id,
                  per_page: 100,
                  page: runPage
                });

                const runs = response.data.workflow_runs || [];

                if (runs.length === 0) break;

                for (const run of runs) {
                  if (!run || !run.id) continue;

                  // Không xóa workflow đang chạy
                  if (String(run.id) === String(context.runId)) {
                    skipped++;
                    continue;
                  }

                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner,
                      repo,
                      run_id: run.id
                    });

                    deleted++;
                    console.log(`Deleted: ${run.id}`);

                  } catch (error) {
                    failed++;
                    console.log(`Failed ${run.id}: ${error.message}`);
                  }
                }

                runPage++;
              }
            }

            console.log('========== CLEANUP SUMMARY ==========');
            console.log(`Deleted: ${deleted}`);
            console.log(`Skipped: ${skipped}`);
            console.log(`Failed: ${failed}`);
            console.log('=====================================');
